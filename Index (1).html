<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM Hidayatullah Mamuju Tengah</title>
    
    <!-- Tailwind CSS (Modern UI) & FontAwesome (Icons) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat version for single-file ease) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* Glassmorphism & Custom CSS */
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .hide { display: none !important; }
        
        /* Mobile Bottom Nav vs Desktop Sidebar */
        #sidebar { transition: all 0.3s ease; }
        @media (max-width: 768px) {
            #sidebar { display: none; }
            #bottom-nav { display: flex; }
            #main-content { margin-left: 0 !important; margin-bottom: 70px; padding: 1rem; }
        }
        @media (min-width: 769px) {
            #bottom-nav { display: none; }
        }
        
        /* Print Styles */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
      
  </style>
  
</head>
<body class="text-gray-800">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-green-50">
        <div class="glass-card p-8 rounded-2xl w-full max-w-md text-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Logo_Hidayatullah.png" alt="Logo" class="w-24 h-24 mx-auto mb-4 object-contain opacity-80" onerror="this.style.display='none'">
            <h2 class="text-2xl font-bold text-green-700 mb-2">SIM Hidayatullah</h2>
            <p class="text-sm text-gray-500 mb-6">Mamuju Tengah</p>
            
            <div class="flex border-b mb-6">
                <button onclick="setLoginType('user')" id="tab-user" class="w-1/2 py-2 text-green-600 border-b-2 border-green-600 font-semibold">Pengurus</button>
                <button onclick="setLoginType('admin')" id="tab-admin" class="w-1/2 py-2 text-gray-400 font-semibold">Admin</button>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="login-id" placeholder="ID / Email / Username" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-green-500 outline-none" required>
                <input type="password" id="login-pass" placeholder="Password" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-green-500 outline-none" required>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition">Masuk</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-4 hide"></p>
        </div>
    </div>

    <!-- APP LAYOUT -->
    <div id="app-layout" class="hide flex h-screen overflow-hidden">
        
        <!-- Desktop Sidebar -->
        <aside id="sidebar" class="w-64 glass-card h-full fixed left-0 top-0 overflow-y-auto flex flex-col z-20">
            <div class="p-6 text-center border-b border-green-100">
                <h1 class="text-xl font-bold text-green-700">SIM Hidayatullah</h1>
                <p class="text-xs text-gray-500" id="user-info-display"></p>
            </div>
            <nav id="sidebar-nav" class="flex-1 p-4 space-y-2"></nav>
            <div class="p-4 border-t border-green-100">
                <button onclick="logout()" class="w-full text-left px-4 py-2 text-red-500 hover:bg-red-50 rounded-lg"><i class="fas fa-sign-out-alt w-6"></i> Keluar</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 ml-64 overflow-y-auto p-8 relative">
            <div id="dynamic-view" class="max-w-6xl mx-auto space-y-6"></div>
        </main>

        <!-- Mobile Bottom Nav -->
        <nav id="bottom-nav" class="fixed bottom-0 w-full glass-card border-t border-gray-200 z-20 flex justify-around p-3 text-sm"></nav>
    </div>

    <!-- Print Area (Hidden unless printing) -->
    <div id="print-area" class="bg-white text-black p-8 hide"></div>

    <script>
        // 1. KONFIGURASI APLIKASI & FIREBASE
        const IS_PREVIEW = false; // Akan false otomatis jika konek ke real DB
        
        // PASTE FIREBASE CONFIG ANDA DI SINI
        const firebaseConfig = {
            apiKey: "AIzaSyDQGEAp6TKgdc6J91HgzDaa1I78VZ0QiFQ",
            authDomain: "sim-dpd-hidayatullah-mateng.firebaseapp.com",
            projectId: "sim-dpd-hidayatullah-mateng",
            storageBucket: "sim-dpd-hidayatullah-mateng.firebasestorage.app",
            messagingSenderId: "799496882079",
            appId: "1:799496882079:web:37ccffe52ac8c835a59faa",
            measurementId: "G-HZ3DY6LXZ7"
        };

        // PWA SETUP (Manifest & Service Worker)
        const manifest = {
            "name": "SIM Hidayatullah Mamuju Tengah",
            "short_name": "SIM Hida",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f0fdf4",
            "theme_color": "#16a34a",
            "icons": [{"src": "https://upload.wikimedia.org/wikipedia/commons/4/4b/Logo_Hidayatullah.png", "sizes": "192x192", "type": "image/png"}]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestURL}">`);

        // INITIALIZE FIREBASE
        let app, db, auth;
        try {
            app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
        } catch (e) { console.warn("Menjalankan mode lokal/preview tanpa Firebase."); }

        // 2. DYNAMIC UI & DATA ENGINE (Schema)
        const appModules = {
            dashboard: { icon: 'fa-chart-pie', label: 'Beranda' },
            lembaga: { icon: 'fa-building', label: 'Profil Lembaga', fields: [
                {name: 'nama', label: 'Nama Lembaga', type: 'text'},
                {name: 'visi', label: 'Visi', type: 'textarea'},
                {name: 'misi', label: 'Misi', type: 'textarea'},
                {name: 'jaringan', label: 'Jaringan / Ranting', type: 'text'}
            ]},
            anggota: { icon: 'fa-users', label: 'Data Kader', fields: [
                {name: 'nama', label: 'Nama Lengkap', type: 'text'},
                {name: 'kontak', label: 'No. HP / WA', type: 'text'},
                {name: 'status', label: 'Status Kader', type: 'select', options: ['Pemula', 'Muda', 'Madya', 'Utama']}
            ]},
            pengurus: { icon: 'fa-user-tie', label: 'Data Pengurus', fields: [
                {name: 'nama', label: 'Nama Pengurus', type: 'text'},
                {name: 'jabatan', label: 'Jabatan (Pisahkan dengan koma jika merangkap)', type: 'text', placeholder: 'Contoh: Ketua, Bendahara'},
                {name: 'username', label: 'Username (Untuk Login)', type: 'text'},
                {name: 'password', label: 'Password', type: 'text'}
            ]},
            proker: { icon: 'fa-tasks', label: 'Program Kerja', fields: [
                {name: 'departemen', label: 'Departemen/Divisi', type: 'text'},
                {name: 'nama_program', label: 'Nama Program', type: 'text'},
                {name: 'rapbo', label: 'Anggaran Direncanakan (RAPBO)', type: 'number'},
                {name: 'realisasi', label: 'Realisasi Anggaran', type: 'number'},
                {name: 'progres', label: 'Progres (%)', type: 'number'},
                {name: 'laporan', label: 'Laporan Berkala', type: 'textarea'}
            ]},
            kegiatan: { icon: 'fa-calendar-check', label: 'Kegiatan', fields: [
                {name: 'nama_kegiatan', label: 'Nama Kegiatan', type: 'text'},
                {name: 'tanggal', label: 'Tanggal Pelaksanaan', type: 'date'},
                {name: 'progres', label: 'Status / Progres', type: 'select', options: ['Direncanakan', 'Berlangsung', 'Selesai', 'Batal']},
                {name: 'laporan', label: 'Laporan Singkat', type: 'textarea'}
            ]},
            keuangan: { icon: 'fa-wallet', label: 'Keuangan', fields: [
                {name: 'tanggal', label: 'Tanggal', type: 'date'},
                {name: 'jenis', label: 'Jenis Arus Kas', type: 'select', options: ['Masuk', 'Keluar', 'Hutang', 'Piutang']},
                {name: 'nominal', label: 'Nominal (Rp)', type: 'number'},
                {name: 'keterangan', label: 'Keterangan', type: 'text'}
            ], customAction: 'Cetak Kwitansi' },
            surat: { icon: 'fa-envelope-open-text', label: 'Surat', fields: [
                {name: 'jenis', label: 'Jenis', type: 'select', options: ['Surat Masuk', 'Surat Keluar']},
                {name: 'nomor', label: 'Nomor Surat', type: 'text'},
                {name: 'perihal', label: 'Perihal', type: 'text'},
                {name: 'tanggal', label: 'Tanggal', type: 'date'}
            ], customAction: 'Generate Surat' }
        };

        let currentRole = 'admin'; 
        let currentUser = null;
        let loginMode = 'user';

        // 3. LOGIC LOGIN & AUTO SETUP
        function setLoginType(type) {
            loginMode = type;
            document.getElementById('tab-user').className = type === 'user' ? "w-1/2 py-2 text-green-600 border-b-2 border-green-600 font-semibold" : "w-1/2 py-2 text-gray-400 font-semibold";
            document.getElementById('tab-admin').className = type === 'admin' ? "w-1/2 py-2 text-green-600 border-b-2 border-green-600 font-semibold" : "w-1/2 py-2 text-gray-400 font-semibold";
        }

        async function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;
            const err = document.getElementById('login-error');
            err.classList.add('hide');

            if (!db) { startApp('Lokal Tester', 'admin'); return; }

            try {
                if (loginMode === 'admin') {
                    await auth.signInWithEmailAndPassword(id, pass);
                    startApp('Administrator', 'admin');
                    autoSetupDatabase(); // Jalankan setup hanya saat admin login pertama
                } else {
                    const snap = await db.collection('pengurus').where('username', '==', id).where('password', '==', pass).get();
                    if (snap.empty) throw new Error("Kredensial Pengurus tidak valid.");
                    const userData = snap.docs[0].data();
                    startApp(`${userData.nama} (${userData.jabatan})`, 'user');
                }
            } catch (error) {
                err.innerText = error.message;
                err.classList.remove('hide');
            }
        }

        function startApp(userName, role) {
            currentUser = userName;
            currentRole = role;
            document.getElementById('login-screen').classList.add('hide');
            document.getElementById('app-layout').classList.remove('hide');
            document.getElementById('user-info-display').innerText = userName;
            buildNav();
            loadView('dashboard');
        }

        function logout() {
            if(auth) auth.signOut();
            window.location.reload();
        }

        // AUTO SETUP DATA AWAL (Firebase Injector)
        async function autoSetupDatabase() {
            if(!db) return;
            const check = await db.collection('lembaga').limit(1).get();
            if(check.empty) {
                // Injeksi Dummy
                db.collection('lembaga').add({ nama: "Yayasan Hidayatullah Mamuju Tengah", visi: "Membangun peradaban Islam", misi: "Tarbiyah dan Dakwah", jaringan: "Tobadak" });
                db.collection('pengurus').add({ nama: "Fulan", jabatan: "Ketua, Bendahara", username: "fulan", password: "123" });
                db.collection('keuangan').add({ tanggal: new Date().toISOString().split('T')[0], jenis: "Masuk", nominal: 5000000, keterangan: "Saldo Awal Kas" });
            }
        }

        // 4. RENDER ENGINE (Membuat Menu, Tabel, dan Form otomatis)
        function buildNav() {
            const side = document.getElementById('sidebar-nav');
            const bot = document.getElementById('bottom-nav');
            side.innerHTML = ''; bot.innerHTML = '';
            
            Object.keys(appModules).forEach(key => {
                const mod = appModules[key];
                const btnSide = `<button onclick="loadView('${key}')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-green-100 transition font-medium text-gray-700 flex items-center gap-3"><i class="fas ${mod.icon} text-green-600 w-5 text-center"></i> ${mod.label}</button>`;
                const btnBot = `<button onclick="loadView('${key}')" class="flex flex-col items-center justify-center w-full text-gray-600 hover:text-green-600"><i class="fas ${mod.icon} text-lg mb-1"></i><span style="font-size: 0.65rem;">${mod.label}</span></button>`;
                side.innerHTML += btnSide;
                if(['dashboard', 'proker', 'kegiatan', 'keuangan'].includes(key)) bot.innerHTML += btnBot; // Max 4 untuk HP
            });
        }

        async function loadView(moduleKey) {
            const container = document.getElementById('dynamic-view');
            container.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fas fa-spinner fa-spin fa-3x"></i><p class="mt-4">Memuat data...</p></div>`;
            
            if(moduleKey === 'dashboard') {
                container.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6 text-green-800">Dashboard Interaktif</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass-card p-6 rounded-2xl border-l-4 border-green-500">
                            <h3 class="text-gray-500 font-medium">Saldo Kas Saat Ini</h3>
                            <p class="text-3xl font-bold text-gray-800 mt-2">Rp. <span id="dash-saldo">0</span></p>
                        </div>
                        <div class="glass-card p-6 rounded-2xl border-l-4 border-blue-500">
                            <h3 class="text-gray-500 font-medium">Total Anggota/Pengurus</h3>
                            <p class="text-3xl font-bold text-gray-800 mt-2"><span id="dash-anggota">0</span> Orang</p>
                        </div>
                        <div class="glass-card p-6 rounded-2xl border-l-4 border-orange-500">
                            <h3 class="text-gray-500 font-medium">Proker Aktif</h3>
                            <p class="text-3xl font-bold text-gray-800 mt-2"><span id="dash-proker">0</span> Program</p>
                        </div>
                    </div>
                `;
                // Simulasi update dashboard
                if(db) {
                    db.collection('keuangan').get().then(s => document.getElementById('dash-saldo').innerText = s.docs.reduce((acc, doc) => acc + (doc.data().jenis=='Masuk'?Number(doc.data().nominal):-Number(doc.data().nominal)), 0).toLocaleString('id-ID'));
                    db.collection('anggota').get().then(s => document.getElementById('dash-anggota').innerText = s.size);
                    db.collection('proker').get().then(s => document.getElementById('dash-proker').innerText = s.size);
                }
                return;
            }

            const mod = appModules[moduleKey];
            let html = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-green-800"><i class="fas ${mod.icon} mr-2"></i> Manajemen ${mod.label}</h2>
                    ${currentRole === 'admin' || moduleKey !== 'lembaga' ? `<button onclick="showForm('${moduleKey}')" class="bg-green-600 text-white px-4 py-2 rounded-xl hover:bg-green-700 font-medium shadow-lg shadow-green-200">+ Tambah Data</button>` : ''}
                </div>
                
                <!-- Form Area -->
                <div id="form-area" class="glass-card p-6 rounded-2xl mb-6 hide">
                    <form id="crud-form" onsubmit="saveData(event, '${moduleKey}')" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${mod.fields.map(f => {
                            if(f.type === 'select') return `<div><label class="block text-sm text-gray-600 mb-1">${f.label}</label><select id="${f.name}" class="w-full p-2 rounded-xl border outline-none focus:border-green-500 bg-white/50" required>${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`;
                            if(f.type === 'textarea') return `<div class="md:col-span-2"><label class="block text-sm text-gray-600 mb-1">${f.label}</label><textarea id="${f.name}" class="w-full p-2 rounded-xl border outline-none focus:border-green-500 bg-white/50" rows="3" required></textarea></div>`;
                            return `<div><label class="block text-sm text-gray-600 mb-1">${f.label}</label><input type="${f.type}" id="${f.name}" placeholder="${f.placeholder||''}" class="w-full p-2 rounded-xl border outline-none focus:border-green-500 bg-white/50" required></div>`;
                        }).join('')}
                        <div class="md:col-span-2 flex justify-end gap-3 mt-4">
                            <button type="button" onclick="document.getElementById('form-area').classList.add('hide')" class="px-5 py-2 text-gray-500 hover:bg-gray-100 rounded-xl">Batal</button>
                            <button type="submit" class="px-5 py-2 bg-green-600 text-white rounded-xl font-medium shadow-lg">Simpan Data</button>
                        </div>
                    </form>
                </div>

                <!-- Table Area -->
                <div class="glass-card rounded-2xl overflow-hidden overflow-x-auto shadow-sm">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-green-50 text-green-800">
                            <tr>
                                ${mod.fields.map(f => `<th class="p-4 font-semibold">${f.label}</th>`).join('')}
                                <th class="p-4 font-semibold text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            `;
            container.innerHTML = html;
            fetchData(moduleKey);
        }

        function showForm(moduleKey) {
            document.getElementById('crud-form').reset();
            document.getElementById('form-area').classList.remove('hide');
        }

        // CRUD LOGIC
        async function fetchData(moduleKey) {
            const tbody = document.getElementById('table-body');
            if(!db) { tbody.innerHTML = `<tr><td colspan="10" class="p-4 text-center">Data lokal simulasi (Sambungkan Firebase)</td></tr>`; return; }
            
            const snap = await db.collection(moduleKey).get();
            tbody.innerHTML = '';
            if(snap.empty) { tbody.innerHTML = `<tr><td colspan="10" class="p-4 text-center text-gray-500">Belum ada data.</td></tr>`; return; }

            snap.forEach(doc => {
                const data = doc.data();
                const fields = appModules[moduleKey].fields;
                let tr = `<tr class="hover:bg-green-50/50 transition">`;
                fields.forEach(f => {
                    let val = data[f.name] || '-';
                    // Format khusus
                    if(f.name === 'nominal' || f.name === 'rapbo' || f.name === 'realisasi') val = 'Rp ' + Number(val).toLocaleString('id-ID');
                    if(f.name === 'progres') val = `<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-lg text-xs font-bold">${val}%</span>`;
                    tr += `<td class="p-4">${val}</td>`;
                });
                
                // Action Buttons
                let actions = `<button onclick="deleteData('${moduleKey}', '${doc.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded-lg ml-2"><i class="fas fa-trash"></i></button>`;
                if(moduleKey === 'keuangan') actions = `<button onclick="cetakKwitansi('${doc.id}', '${data.tanggal}', '${data.nominal}', '${data.keterangan}')" class="text-green-600 hover:bg-green-50 p-2 rounded-lg text-xs font-bold border border-green-200">Kwitansi</button>` + actions;
                if(moduleKey === 'surat') actions = `<button onclick="generateSurat('${doc.id}', '${data.nomor}', '${data.perihal}')" class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg text-xs font-bold border border-blue-200">Cetak Surat</button>` + actions;
                
                tr += `<td class="p-4 text-right">${actions}</td></tr>`;
                tbody.innerHTML += tr;
            });
        }

        async function saveData(e, moduleKey) {
            e.preventDefault();
            const fields = appModules[moduleKey].fields;
            let data = {};
            fields.forEach(f => {
                data[f.name] = document.getElementById(f.name).value;
            });
            
            if(db) await db.collection(moduleKey).add(data);
            document.getElementById('form-area').classList.add('hide');
            fetchData(moduleKey);
        }

        async function deleteData(moduleKey, id) {
            if(confirm('Hapus data ini?')) {
                if(db) await db.collection(moduleKey).doc(id).delete();
                fetchData(moduleKey);
            }
        }

        // 5. FITUR GENERATOR OTOMATIS (Kwitansi & Surat)
        function cetakKwitansi(id, tgl, nominal, ket) {
            const pa = document.getElementById('print-area');
            pa.innerHTML = `
                <div class="border-4 border-double border-gray-800 p-8 max-w-2xl mx-auto">
                    <div class="text-center mb-6 border-b-2 border-gray-800 pb-4">
                        <h1 class="text-2xl font-bold">BUKTI KAS / KWITANSI</h1>
                        <p>Hidayatullah Mamuju Tengah</p>
                    </div>
                    <div class="mb-4"><span class="font-bold w-40 inline-block">Nomor Transaksi</span>: TR/MT/${id.substring(0,6).toUpperCase()}</div>
                    <div class="mb-4"><span class="font-bold w-40 inline-block">Tanggal</span>: ${tgl}</div>
                    <div class="mb-4"><span class="font-bold w-40 inline-block">Sejumlah</span>: Rp. ${Number(nominal).toLocaleString('id-ID')}</div>
                    <div class="mb-8"><span class="font-bold w-40 inline-block">Untuk Pembayaran</span>: ${ket}</div>
                    <div class="flex justify-end mt-12 text-center">
                        <div>
                            <p class="mb-16">Penerima / Bendahara</p>
                            <p class="font-bold underline">( ........................................ )</p>
                        </div>
                    </div>
                </div>
            `;
            window.print();
            pa.innerHTML = '';
        }

        function generateSurat(id, no, perihal) {
            const pa = document.getElementById('print-area');
            pa.innerHTML = `
                <div class="max-w-4xl mx-auto px-12 py-8 bg-white">
                    <div class="flex items-center border-b-4 border-black pb-4 mb-8">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Logo_Hidayatullah.png" class="w-24 h-24 mr-6">
                        <div class="text-center flex-1">
                            <h1 class="text-3xl font-bold uppercase">Dewan Pengurus Daerah</h1>
                            <h2 class="text-2xl font-bold uppercase">Hidayatullah Mamuju Tengah</h2>
                            <p class="text-sm">Sekretariat: Tobadak, Mamuju Tengah, Sulawesi Barat</p>
                        </div>
                    </div>
                    <div class="mb-8">
                        <p>Nomor : ${no}</p>
                        <p>Lamp. : -</p>
                        <p>Hal   : <b>${perihal}</b></p>
                    </div>
                    <div class="mb-8 text-justify leading-relaxed min-h-[300px]">
                        <p><i>Bismillahirrahmanirrahim,</i></p><br>
                        <p>Puji syukur kehadirat Allah SWT atas segala limpahan rahmat-Nya. Shalawat dan salam senantiasa tercurah kepada Nabi Muhammad SAW.</p><br>
